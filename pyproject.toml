[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llmgater"
dynamic = ["version"]
description = "Async LLM router with backend failover, similarity caching, per-account token quotas, PII and injection filtering, and schema-validated outputs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lzradeel" }]
keywords = [
  "llm",
  "router",
  "openai",
  "anthropic",
  "failover",
  "llm-cache",
  "pii-redaction",
  "pydantic",
  "structured-output",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Framework :: Pydantic :: 2",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/lzradeel/llmgater"
Repository = "https://github.com/lzradeel/llmgater"
Issues = "https://github.com/lzradeel/llmgater/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.version]
path = "src/llmgater/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llmgater"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
